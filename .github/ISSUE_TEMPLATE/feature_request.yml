name: Feature request
description: Propose a bounded capability or workflow improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user workflow or measurement task is currently blocked?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired observable outcome
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and hardware constraints
      description: Mention camera, platform, persistence, model, or compatibility constraints
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
