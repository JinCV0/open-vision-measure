[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-vision-measure"
version = "0.3.0"
description = "Local-first microscope imaging and measurement workbench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "JinCV0" }]
keywords = ["microscopy", "measurement", "computer-vision", "pyside6", "opencv"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video :: Capture",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=2.2,<3",
  "opencv-python-headless>=4.11,<5",
  "PySide6>=6.9,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=9.0.3,<10",
  "pytest-qt>=4.4,<5",
  "ruff>=0.11,<1",
]

[project.scripts]
vision-measure = "vision_measure.ui.app:main"

[project.urls]
Homepage = "https://github.com/JinCV0/open-vision-measure"
Repository = "https://github.com/JinCV0/open-vision-measure"
Issues = "https://github.com/JinCV0/open-vision-measure/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_measure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vision_measure"]
mypy_path = "src"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
